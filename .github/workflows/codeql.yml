name: CodeQL

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  schedule:
    - cron: "24 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  analyze:
    name: Analyze C++
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install MSYS2 UCRT64 GCC
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      # build.ps1 runs from ordinary PowerShell. setup-msys2 may install into
      # the runner's temporary tools directory, so expose UCRT64\bin to later
      # PowerShell steps instead of assuming C:\msys64.
      - name: Add UCRT64 GCC to PATH
        shell: pwsh
        run: |
          $ucrtBin = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"
          if (-not (Test-Path (Join-Path $ucrtBin "g++.exe"))) {
            throw "g++.exe was not found in $ucrtBin"
          }
          $ucrtBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: none

      - name: Build RPCS3 Texture Dumper
        shell: pwsh
        run: .\build.ps1

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp
